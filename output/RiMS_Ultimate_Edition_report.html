<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiMS Ultimate Edition - Game Deal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1b2838;
            color: #c7d5e0;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }
        .game-card {
            max-width: 900px;
            width: 100%;
            background: #2a475e;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            border-bottom: 1px solid #4b6b7f;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .game-title {
            font-size: 2.2em;
            font-weight: 700;
            color: #ffffff;
        }
        .game-store {
            background: #4b6b7f;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: 500;
            color: #e5e5e5;
            margin-top: 8px;
        }
        .game-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px 40px;
            background: #1b2838;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        .detail-label {
            font-size: 0.8em;
            text-transform: uppercase;
            color: #8f9fa8;
            letter-spacing: 0.5px;
        }
        .detail-value {
            font-size: 1.2em;
            font-weight: 600;
            color: #ffffff;
            margin-top: 2px;
        }
        .price-box {
            display: flex;
            align-items: baseline;
            gap: 15px;
            flex-wrap: wrap;
        }
        .normal-price {
            text-decoration: line-through;
            color: #8f9fa8;
            font-size: 1em;
        }
        .sale-price {
            font-size: 1.8em;
            font-weight: 700;
            color: #5cbf5c;
        }
        .description {
            margin: 20px 0;
            padding: 15px;
            background: #1b2838;
            border-radius: 8px;
            line-height: 1.6;
            color: #c7d5e0;
        }
        .btn-buy {
            display: inline-block;
            background: #5cbf5c;
            color: #fff;
            padding: 14px 35px;
            border-radius: 30px;
            font-size: 1.1em;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-buy:hover {
            background: #4da64d;
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(92, 191, 92, 0.4);
        }
        .footer {
            margin-top: 20px;
            font-size: 0.8em;
            color: #8f9fa8;
            border-top: 1px solid #4b6b7f;
            padding-top: 15px;
            text-align: center;
        }
        @media (max-width: 600px) {
            .game-details { grid-template-columns: 1fr; }
            .game-title { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="game-card">
        <div class="game-header">
            <div class="game-title">RiMS Ultimate Edition</div>
            <div class="game-store">Epic Games Store</div>
        </div>
        <div class="game-details">
            <div class="detail-item">
                <span class="detail-label">Price</span>
                <div class="price-box">
                    <span class="normal-price">$5.21</span>
                    <span class="sale-price">$3.47</span>
                </div>
            </div>
            <div class="detail-item">
                <span class="detail-label">Popularity Rank</span>
                <span class="detail-value">#74</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Rating</span>
                <span class="detail-value">6.7 / 10</span>
            </div>
            <div class="detail-item">
                <span class="detail-label">Release Year</span>
                <span class="detail-value">2021</span>
            </div>
        </div>
        <div class="description">
            Available on Epic Games
        </div>
        <div style="text-align: center; margin: 25px 0 10px;">
            <a href="https://www.cheapshark.com/redirect?dealID=r5WMNvjeIMvCavj0Pe1YLAdiIdKLxN%2FdfvROJbUNLH4%3D" class="btn-buy" target="_blank">🎮 Buy Now on Epic Games Store</a>
        </div>
        <div class="footer">
            Generated by Game Aggregator &bull; Data provided by CheapShark
        </div>
    </div>
</body>
</html>
